<!DOCTYPE html>

<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Cadastro - MGV Tecnologia</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">tailwind.config = {darkMode: "class", theme: {extend: {colors: {"on-tertiary-fixed-variant": "#454748", "inverse-primary": "#c9c6c5", "secondary-container": "#fdc003", "surface-variant": "#e5e2e2", secondary: "#785900", "surface-dim": "#dcd9d9", "on-tertiary-fixed": "#1a1c1d", "on-primary-fixed-variant": "#484646", "surface-bright": "#fcf9f8", tertiary: "#000001", "status-error": "#EF4444", "status-info": "#3B82F6", outline: "#7d7577", "surface-white": "#FFFFFF", "inverse-on-surface": "#f3f0f0", "tertiary-container": "#1a1c1d", error: "#ba1a1a", "primary-fixed-dim": "#c9c6c5", "on-tertiary-container": "#838485", "on-primary-container": "#868383", "surface-container": "#f0eded", "on-secondary-fixed-variant": "#5b4300", "secondary-fixed-dim": "#fabd00", "on-primary-fixed": "#1c1b1b", "on-secondary-fixed": "#261a00", "surface-container-highest": "#e5e2e2", "primary-fixed": "#e6e1e1", "on-surface": "#1b1b1c", background: "#fcf9f8", "tertiary-fixed-dim": "#c6c6c7", "on-tertiary": "#ffffff", "on-surface-variant": "#4c4547", "on-error-container": "#93000a", "secondary-fixed": "#ffdf9e", "on-background": "#1b1b1c", "status-success": "#10B981", "status-warning": "#F59E0B", "on-secondary-container": "#6c5000", "error-container": "#ffdad6", surface: "#fcf9f8", "surface-container-lowest": "#ffffff", "outline-variant": "#cfc4c6", "primary-container": "#1c1b1b", "on-secondary": "#ffffff", "inverse-surface": "#313031", "on-error": "#ffffff", primary: "#000000", "tertiary-fixed": "#e2e2e3", "surface-tint": "#605e5e", "on-primary": "#ffffff", "surface-container-low": "#f6f3f3", "surface-container-high": "#eae7e7"}, borderRadius: {DEFAULT: "0.5rem", lg: "1rem", xl: "1.5rem", full: "9999px"}, spacing: {"margin-mobile": "16px", "margin-desktop": "32px", "sidebar-width": "260px", gutter: "16px", "max-content-width": "1440px", unit: "4px"}, fontFamily: {"body-md": ["Inter"], "headline-md": ["Inter"], "label-md": ["Inter"], "headline-lg": ["Inter"], "body-lg": ["Inter"], "title-lg": ["Inter"], "label-sm": ["Inter"], "data-tabular": ["Inter"], "headline-sm": ["Inter"], headline: ["Inter"], display: ["Inter"], body: ["Inter"], label: ["Inter"]}, fontSize: {}}}};</script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F4F4F5;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .strength-bar {
            transition: width 0.3s ease, background-color 0.3s ease;
        }
        .focus-ring:focus {
            outline: none;
            border-color: #1C1B1B;
            box-shadow: 0 0 0 2px #FFC107;
        }
        .bento-card {
            background-color: #FFFFFF;
            border: 1px solid #EAE7E7;
        }
    </script>
</head>
<body class="min-h-screen flex flex-col">

    <!-- TopAppBar -->
    <header class="bg-background border-b border-outline-variant w-full h-16 flex justify-between items-center px-margin-desktop max-w-max-content-width mx-auto sticky top-0 z-50">
        <div class="flex items-center gap-4">
            <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuDydCIZ4ApQDPxhyoHD128NDXcVTMpGyHFU1jXaFusaQfCd0cjKiLzr2mJgzX_dr87bnzxK0kBbsybYZPWzHSz5jIVJWNydNPDjqqKjzgUgcAZ1LChi2VADht7qtJD0U7xF6sqEFzHj52GP7ld2gt4Ul2ZVf4SVgeSIhbjA1vb2A-w9ihfECYg_kgsetX-3bwjjFXRMKvi7bygmaRgJ_z718OOB5OoldFt8L5wjX8gvuz09pcUW11Rh9slZRqVuqLurlMRxZWtAUCDE" alt="MGV Tecnologia" class="h-8 w-auto">
            <span class="text-title-lg font-title-lg font-bold text-primary uppercase tracking-wider hidden md:block">MGV Tecnologia</span>
        </div>
        <div class="flex items-center gap-4 text-primary">
            <span class="material-symbols-outlined cursor-pointer hover:bg-surface-container-high p-2 transition-colors">help_outline</span>
            <span class="material-symbols-outlined cursor-pointer hover:bg-surface-container-high p-2 transition-colors">settings</span>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center py-12 px-margin-mobile">
        <div class="w-full max-w-4xl grid grid-cols-1 md:grid-cols-12 gap-gutter">
            
            <!-- Information Panel (Technical Context) -->
            <div class="md:col-span-5 flex flex-col justify-center space-y-6">
                <h1 class="text-headline-lg font-headline-lg text-primary">Primeiro Acesso</h1>
                <p class="text-body-lg font-body-lg text-on-surface-variant leading-relaxed">
                    Configure sua credencial técnica para acessar o sistema de gestão da MGV Tecnologia. 
                    Mantenha a integridade dos dados e o controle operacional.
                </p>
                
                <div class="space-y-4">
                    <div class="flex items-start gap-3">
                        <span class="material-symbols-outlined text-secondary pt-1">verified_user</span>
                        <div>
                            <p class="font-label-md text-label-md text-primary uppercase tracking-wide">Segurança Avançada</p>
                            <p class="text-body-md font-body-md text-on-surface-variant">Criptografia de ponta para todos os logs de serviço.</p>
                        </div>
                    </div>
                    <div class="flex items-start gap-3">
                        <span class="material-symbols-outlined text-secondary pt-1">engineering</span>
                        <div>
                            <p class="font-label-md text-label-md text-primary uppercase tracking-wide">Gestão Técnica</p>
                            <p class="text-body-md font-body-md text-on-surface-variant">Controle total sobre o Staff Management e ordens de serviço.</p>
                        </div>
                    </div>
                </div>

                <div class="pt-4">
                    <a href="/login" class="text-label-md font-label-md text-secondary hover:underline flex items-center gap-1 group">
                        <span class="material-symbols-outlined text-[18px] group-hover:-translate-x-1 transition-transform">arrow_back</span>
                        Já possui conta? Voltar ao Login
                    </a>
                </div>
            </div>

            <!-- Registration Form Card -->
            <div class="md:col-span-7 bento-card p-8 shadow-sm">
                <form id="registrationForm" class="space-y-6">
                    <div class="grid grid-cols-1 gap-6">
                        <!-- Nome -->
                        <div class="space-y-1.5">
                            <label for="name" class="text-label-md font-label-md text-on-surface-variant uppercase">Nome Completo</label>
                            <input type="text" id="name" placeholder="Ex: João Silva" required
                                class="w-full h-11 px-4 border border-outline-variant bg-surface-white focus-ring text-body-md font-body-md">
                        </div>

                        <!-- E-mail -->
                        <div class="space-y-1.5">
                            <label for="email" class="text-label-md font-label-md text-on-surface-variant uppercase">E-mail Corporativo</label>
                            <input type="email" id="email" placeholder="nome@mgvtecnologia.com.br" required
                                class="w-full h-11 px-4 border border-outline-variant bg-surface-white focus-ring text-body-md font-body-md">
                        </div>

                        <!-- Password -->
                        <div class="space-y-1.5">
                            <label for="password" class="text-label-md font-label-md text-on-surface-variant uppercase">Definir Senha</label>
                            <input type="password" id="password" placeholder="••••••••" required
                                class="w-full h-11 px-4 border border-outline-variant bg-surface-white focus-ring text-body-md font-body-md">
                            <!-- Password Strength Indicator -->
                            <div class="h-1 w-full bg-surface-container mt-2">
                                <div id="strengthMeter" class="strength-bar h-full w-0 bg-status-error"></div>
                            </div>
                            <span id="strengthText" class="text-label-sm font-label-sm text-on-surface-variant">Digite uma senha...</span>
                        </div>

                        <!-- Role Selection -->
                        <div class="space-y-3">
                            <label class="text-label-md font-label-md text-on-surface-variant uppercase">Selecione o Perfil</label>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <!-- Owner Role -->
                                <label class="relative group cursor-pointer">
                                    <input type="radio" name="role" value="OWNER" class="peer sr-only" checked>
                                    <div class="p-4 border border-outline-variant bg-surface-white peer-checked:border-primary peer-checked:bg-secondary-container/5 hover:border-secondary transition-all h-full">
                                        <div class="flex items-center justify-between mb-2">
                                            <span class="material-symbols-outlined text-primary">admin_panel_settings</span>
                                            <div class="peer-checked:block hidden w-2 h-2 rounded-full bg-secondary"></div>
                                        </div>
                                        <p class="font-label-md text-label-md text-primary">OWNER</p>
                                        <p class="text-label-sm font-label-sm text-on-surface-variant mt-1">Acesso total ao sistema, gestão de faturamento e configuração global.</p>
                                    </div>
                                </label>
                                <!-- Editor Role -->
                                <label class="relative group cursor-pointer">
                                    <input type="radio" name="role" value="EDITOR" class="peer sr-only">
                                    <div class="p-4 border border-outline-variant bg-surface-white peer-checked:border-primary peer-checked:bg-secondary-container/5 hover:border-secondary transition-all h-full">
                                        <div class="flex items-center justify-between mb-2">
                                            <span class="material-symbols-outlined text-primary">edit_note</span>
                                            <div class="peer-checked:block hidden w-2 h-2 rounded-full bg-secondary"></div>
                                        </div>
                                        <p class="font-label-md text-label-md text-primary">EDITOR</p>
                                        <p class="text-label-sm font-label-sm text-on-surface-variant mt-1">Gestão técnica de ordens de serviço, logs e inventário de peças.</p>
                                    </div>
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="pt-4">
                        <button type="submit" class="w-full h-12 bg-primary text-on-primary font-label-md text-label-md uppercase tracking-widest hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                            <span>Criar Conta Técnica</span>
                            <span class="material-symbols-outlined">rocket_launch</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-surface-container-low border-t border-outline-variant w-full mt-auto">
        <div class="flex flex-col md:flex-row justify-between items-center px-margin-desktop py-8 w-full max-w-max-content-width mx-auto gap-4">
            <div class="flex flex-col items-center md:items-start">
                <span class="text-label-md font-label-md font-bold uppercase text-primary">MGV Tecnologia</span>
                <p class="text-label-sm font-label-sm text-on-surface-variant mt-1">© 2024 Technical Assistance Management System.</p>
            </div>
            <div class="flex gap-6">
                <a href="#" class="text-label-sm font-label-sm text-on-surface-variant hover:text-primary transition-colors">Privacy Policy</a>
                <a href="#" class="text-label-sm font-label-sm text-on-surface-variant hover:text-primary transition-colors">Technical Support</a>
                <a href="#" class="text-label-sm font-label-sm text-on-surface-variant hover:text-primary transition-colors">Terms of Service</a>
            </div>
        </div>
    </footer>

    <script>
        const passwordInput = document.getElementById('password');
        const strengthMeter = document.getElementById('strengthMeter');
        const strengthText = document.getElementById('strengthText');

        passwordInput.addEventListener('input', () => {
            const val = passwordInput.value;
            let strength = 0;
            
            if (val.length > 0) strength += 20;
            if (val.length >= 8) strength += 20;
            if (/[A-Z]/.test(val)) strength += 20;
            if (/[0-9]/.test(val)) strength += 20;
            if (/[^A-Za-z0-9]/.test(val)) strength += 20;

            strengthMeter.style.width = strength + '%';

            if (strength <= 40) {
                strengthMeter.style.backgroundColor = '#EF4444'; // status-error
                strengthText.innerText = 'Senha Fraca - Use símbolos e números';
                strengthText.classList.replace('text-status-warning', 'text-status-error');
                strengthText.classList.replace('text-status-success', 'text-status-error');
            } else if (strength <= 80) {
                strengthMeter.style.backgroundColor = '#F59E0B'; // status-warning
                strengthText.innerText = 'Senha Média - Adicione letras maiúsculas';
                strengthText.classList.replace('text-status-error', 'text-status-warning');
                strengthText.classList.replace('text-status-success', 'text-status-warning');
            } else {
                strengthMeter.style.backgroundColor = '#10B981'; // status-success
                strengthText.innerText = 'Senha Forte - Proteção técnica elevada';
                strengthText.classList.replace('text-status-error', 'text-status-success');
                strengthText.classList.replace('text-status-warning', 'text-status-success');
            }
        });

        document.getElementById('registrationForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalContent = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span><span>Processando...</span>';
            
            setTimeout(() => {
                alert('Solicitação de acesso enviada para aprovação do administrador MGV.');
                btn.disabled = false;
                btn.innerHTML = originalContent;
            }, 1500);
        });
    </script>
</body>
</html></style></head><body></body></html>
