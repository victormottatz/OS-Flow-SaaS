<!-- Interactive Loading Logic -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const progressIndicator = document.getElementById('progress-indicator');
            const statusMain = document.getElementById('status-main');
            const statusSecondary = document.getElementById('status-secondary');
            
            const steps = [
                { progress: 15, main: "Conectando ao servidor central...", secondary: "Autenticando credenciais de segurança" },
                { progress: 35, main: "Carregando módulos de ativos...", secondary: "Sincronizando inventário de equipamentos" },
                { progress: 60, main: "Processando ordens pendentes...", secondary: "Atualizando cronogramas de manutenção" },
                { progress: 85, main: "Verificando integridade do sistema...", secondary: "Finalizando configurações de interface" },
                { progress: 100, main: "Ambiente pronto", secondary: "Aguardando inicialização da dashboard" }
            ];

            let currentStep = 0;

            const updateProgress = () => {
                if (currentStep < steps.length) {
                    const step = steps[currentStep];
                    
                    // Update visual state
                    progressIndicator.style.width = `${step.progress}%`;
                    
                    // Smooth text transition
                    statusMain.style.opacity = '0';
                    statusSecondary.style.opacity = '0';
                    
                    setTimeout(() => {
                        statusMain.textContent = step.main;
                        statusSecondary.textContent = step.secondary;
                        statusMain.style.opacity = '1';
                        statusSecondary.style.opacity = '1';
                    }, 300);

                    currentStep++;
                    
                    // Variable loading speeds for a more "realistic" technical feel
                    const nextDelay = Math.random() * (1500 - 800) + 800;
                    if (currentStep < steps.length) {
                        setTimeout(updateProgress, nextDelay);
                    } else {
                        // Final redirect simulation or transition
                        setTimeout(() => {
                            document.body.classList.add('transition-opacity', 'duration-700', 'opacity-0');
                        }, 1200);
                    }
                }
            };

            // Initial start
            setTimeout(updateProgress, 800);
        });
    </script>
