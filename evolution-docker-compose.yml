version: '3.3'
services:
  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution_api
    restart: always
    ports:
      - "8081:8080"
    environment:
      - SERVER_URL=https://whatsapp.mgvrp.com.br
      - CORS_ORIGIN=*
      - CORS_METHODS=GET,POST,PUT,DELETE
      - CORS_CREDENTIALS=true
      # Chave de API Global para requisições seguras
      - AUTHENTICATION_API_KEY=K8kL3#mZ9$pQ2wE5
      - AUTHENTICATION_EXPOSE_IN_ENV=true
      - LOG_LEVEL=ERROR,WARN,DEBUG,INFO,LOG,VERBOSE,DARK,WEBHOOKS
      # Configurações do Banco de Dados (Opcional, usando memória por padrão se não ativado)
      - DATABASE_ENABLED=false
      # Habilitar webhooks
      - WEBHOOK_GLOBAL_URL=https://sistema.mgvrp.com.br/api/whatsapp/webhook
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_GLOBAL_EVENTS=APPLICATION_STARTUP,QRCODE_UPDATED,MESSAGES_UPSERT,MESSAGES_UPDATE,MESSAGES_DELETE,SEND_MESSAGE,CONNECTION_UPDATE,CALL
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store

volumes:
  evolution_instances:
  evolution_store:
